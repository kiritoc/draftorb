name: ETL refresh

# Scheduled data pipeline (D-057, D-078, D-079): downloads the newest `state-*`
# release from the private state repo (default `draftorb-state`, override with
# the STATE_REPO repository variable), restores the SQLite database, refreshes
# matches and configured profiles, re-aggregates and re-exports data/public,
# then publishes a new `state-*` release with `DraftOrb.sqlite.gz` (always,
# partial progress included) and `public-exports.tar.gz` (only on success).
#
# The app is local-only: nothing is committed to main and no deploy workflow
# exists. Exports reach the app via `pnpm etl pull`.
#
# Secrets: RIOT_API_KEY (Riot key) and STATE_REPO_TOKEN (fine-grained PAT with
# Contents read/write on the state repo only — GITHUB_TOKEN cannot reach it).
# The newest state release is required: the job refuses to run without one so
# an empty database can never overwrite good state.
#
# Log hygiene (D-078 point 9): this repo is public, so workflow logs are
# public. ETL output must never contain other players' Riot IDs, puuids or
# match ids, nor the profile owner's raw game data.

on:
  schedule:
    - cron: '37 */12 * * *' # every 12h, off-peak minute
  workflow_dispatch:

permissions:
  contents: read # checkout only; the state repo is reached via STATE_REPO_TOKEN

concurrency:
  group: etl-refresh
  cancel-in-progress: false

env:
  # Repository variable STATE_REPO may hold a bare repo name (resolved under
  # this repository's owner in the fetch step) or a full owner/name slug —
  # default draftorb-state (D-078).
  STATE_REPO: ${{ vars.STATE_REPO || 'draftorb-state' }}
  DB_FILE: DraftOrb.sqlite.gz
  DRAFTORB_DB_PATH: ${{ github.workspace }}/data/DraftOrb.sqlite
  EXPORTS_FILE: public-exports.tar.gz

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The pipeline mutates the shared state released from this workflow; a
      # manual run on another branch would publish state the owner did not
      # ask for (D-058 guard, kept per D-079).
      - name: Restrict to main
        if: github.ref_name != 'main'
        run: |
          echo "::error::ETL refresh only runs on the main branch (dispatched ref: ${{ github.ref_name }})"
          exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Restore the newest state-* release. Fails early when the token is
      # missing/rejected or when no release exists (D-078 points 2 and 5).
      - name: Fetch database state
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/state"
          mkdir -p "$STATE_DIR" "$(dirname "$DRAFTORB_DB_PATH")"
          # Bare repo name -> same owner as this repository; a full
          # owner/name slug is used as-is. Persisted for later steps.
          if [[ "$STATE_REPO" == */* ]]; then
            RESOLVED_REPO="$STATE_REPO"
          else
            RESOLVED_REPO="${{ github.repository_owner }}/$STATE_REPO"
          fi
          echo "STATE_REPO=$RESOLVED_REPO" >> "$GITHUB_ENV"
          STATE_REPO="$RESOLVED_REPO"
          if [ -z "${STATE_REPO_TOKEN:-}" ]; then
            echo "::error::Secret STATE_REPO_TOKEN is not set (fine-grained PAT with Contents read/write on $STATE_REPO — see SETUP.md)"
            exit 1
          fi
          export GH_TOKEN="$STATE_REPO_TOKEN"
          if ! gh api "repos/$STATE_REPO" --jq .full_name >/dev/null 2>"$STATE_DIR/repo.err"; then
            echo "::error::Cannot access state repo '$STATE_REPO': the STATE_REPO_TOKEN is missing, expired or lacks Contents read/write on that repo. $(tr '\n' ' ' < "$STATE_DIR/repo.err")"
            exit 1
          fi
          # state-<UTC yyyymmddThhmmZ> tags sort chronologically; seconds are
          # optional (a manually seeded tag may carry them), so sort by a
          # normalized key — plain string sort misorders mixed widths.
          TAG=$(gh release list --repo "$STATE_REPO" --limit 100 --json tagName \
            | jq -r '[.[].tagName | select(test("^state-[0-9]{8}T[0-9]{4,6}Z$"))]
              | sort_by(.[6:14] + ((.[15:-1] + "000000")[0:6])) | last // ""')
          if [ -z "$TAG" ]; then
            echo "::error::No state-* release found in '$STATE_REPO'; seed the first release manually (SETUP.md > Seeding the first state release)"
            exit 1
          fi
          echo "Restoring database from release $TAG"
          if ! gh release download "$TAG" --repo "$STATE_REPO" \
            --pattern "$DB_FILE" --dir "$STATE_DIR" --clobber; then
            echo "::error::Could not download $DB_FILE from release $TAG in '$STATE_REPO'"
            exit 1
          fi
          gunzip -c "$STATE_DIR/$DB_FILE" > "$DRAFTORB_DB_PATH"
          echo "Database restored from $TAG"

      - name: Apply pending migrations
        run: pnpm etl migrate

      - name: Check Riot API key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: pnpm etl check-key euw1

      - name: Import latest static data
        run: pnpm etl static

      # Drift check (never fails): warns when champion-tags.json is missing
      # tags for support champions or references champion ids the freshly
      # fetched catalog no longer has.
      - name: Check champion tags drift
        run: pnpm etl check-tags

      - name: Refresh already-ingested players
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: pnpm etl matches euw1 --refresh

      - name: Ingest pending players (bounded)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: pnpm etl matches euw1 --limit 100

      # Non-fatal like `status`: a failed profile must not block the match
      # pipeline, and writeProfileExports only runs on the success path so
      # data/public/profiles keeps the previous export (D-070).
      - name: Sync configured profiles
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: pnpm etl profile-sync --publish || echo "::warning::profile-sync failed; previous exports are kept"

      - name: Prune matches beyond retention window
        run: pnpm etl prune

      - name: Rebuild aggregates and export
        run: |
          pnpm etl aggregate
          pnpm etl derive-roles
          pnpm etl export
          # B-052 guard: a degenerate export (empty role lists) must not be
          # published — failure here keeps the previous exports release while
          # the database state above is still uploaded (if: always()).
          pnpm etl validate-export
          pnpm etl status euw1 || echo "::warning::status command failed"

      # always(): partial progress (cursors, stored matches) must be saved even
      # when a pipeline step failed — ingestion is resumable from the cursors.
      # Order per D-078: wal_checkpoint(TRUNCATE) -> integrity_check must be
      # "ok" (otherwise nothing is uploaded) -> VACUUM -> gzip.
      - name: Compact and check database
        if: always()
        run: |
          set -e
          if [ ! -f "$DRAFTORB_DB_PATH" ]; then
            echo "No database file; nothing to save"
            exit 0
          fi
          cd packages/etl
          node -e '
            const Database = require("better-sqlite3");
            const db = new Database(process.env.DRAFTORB_DB_PATH);
            db.pragma("busy_timeout = 30000");
            db.pragma("wal_checkpoint(TRUNCATE)");
            const rows = db.pragma("integrity_check");
            const ok = rows.length === 1 && rows[0].integrity_check === "ok";
            if (!ok) {
              console.error("PRAGMA integrity_check failed:", JSON.stringify(rows));
              process.exit(3);
            }
            db.exec("VACUUM");
            db.close();
          '
          gzip -9 -n -c "$DRAFTORB_DB_PATH" > "$RUNNER_TEMP/$DB_FILE"

      # The DB asset is uploaded even when the pipeline failed (if: always())
      # so partial progress is never lost; the exports asset below is
      # success-only (D-078 point 3).
      - name: Upload database state release
        id: upload
        if: always()
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          DB_GZ="$RUNNER_TEMP/$DB_FILE"
          if [ ! -f "$DB_GZ" ]; then
            echo "No compressed database; skipping state upload"
            exit 0
          fi
          if [ -z "${STATE_REPO_TOKEN:-}" ]; then
            echo "::error::Secret STATE_REPO_TOKEN is not set; cannot upload $DB_FILE"
            exit 1
          fi
          export GH_TOKEN="$STATE_REPO_TOKEN"
          TAG="state-$(date -u +%Y%m%dT%H%MZ)"
          if gh release view "$TAG" --repo "$STATE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DB_GZ" --repo "$STATE_REPO" --clobber
          else
            gh release create "$TAG" "$DB_GZ" --repo "$STATE_REPO" \
              --title "ETL state $TAG" \
              --notes "Automated ETL state snapshot (D-078)."
          fi
          echo "Published $TAG with $DB_FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # Exports are packed and uploaded only when the whole pipeline succeeded
      # (implicit success()): a failed run keeps the previous exports.
      - name: Scan exports for leaked secrets
        run: node scripts/check-secrets.mjs --dist off

      - name: Pack public exports
        run: tar -czf "$RUNNER_TEMP/$EXPORTS_FILE" -C data public

      - name: Upload exports asset
        if: success() && steps.upload.outputs.uploaded == 'true'
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$STATE_REPO_TOKEN"
          gh release upload "${{ steps.upload.outputs.tag }}" \
            "$RUNNER_TEMP/$EXPORTS_FILE" --repo "$STATE_REPO" --clobber
          echo "Attached $EXPORTS_FILE to ${{ steps.upload.outputs.tag }}"

      # Retention (D-078 point 4): keep the newest 7 state-* releases, delete
      # older ones including their tags — only after a fully successful run
      # (a failed run's DB-only release must not evict releases that still
      # carry the exports asset `pnpm etl pull` needs).
      - name: Prune old state releases
        if: success() && steps.upload.outputs.uploaded == 'true'
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$STATE_REPO_TOKEN"
          OLD_TAGS=$(gh release list --repo "$STATE_REPO" --limit 100 --json tagName \
            | jq -r '[.[].tagName | select(test("^state-[0-9]{8}T[0-9]{4,6}Z$"))]
              | sort_by(.[6:14] + ((.[15:-1] + "000000")[0:6])) | reverse | .[7:][]')
          if [ -z "$OLD_TAGS" ]; then
            echo "Nothing to prune (newest 7 state-* releases kept)"
            exit 0
          fi
          for tag in $OLD_TAGS; do
            echo "Deleting old state release $tag"
            gh release delete "$tag" --repo "$STATE_REPO" --cleanup-tag --yes
          done
