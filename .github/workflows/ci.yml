name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Untrusted: runs PR-controlled code with no secrets and a read-only token.
  format:
    # Only same-repo PRs; fork PRs have no secrets and are covered by format:check.
    # On push events pull_request is empty, so this is false there too.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Workflows are never auto-formatted (bot must not edit .github); format them locally.
      - run: pnpm prettier --write . '!.github/**'

      - name: Create patch
        id: diff
        run: |
          git diff --binary -- . ':!.github' > format.patch
          if [ -s format.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: format-patch
          path: format.patch
          retention-days: 1

  # Trusted: only applies the patch and pushes; never runs PR code.
  commit-format:
    needs: format
    if: needs.format.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}

    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FORMAT_BOT_APP_ID }}
          private-key: ${{ secrets.FORMAT_BOT_PRIVATE_KEY }}
          # Least privilege: this repo only, contents:write only.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}

      - uses: actions/download-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}

      - name: Apply patch
        env:
          PATCH: ${{ runner.temp }}/format.patch
        run: |
          # Reject anything outside the working tree or under .github.
          if git apply --numstat "$PATCH" | awk '{print $3}' | grep -E '^(\.github/|/|\.\./)'; then
            echo "::error::Patch touches disallowed paths"; exit 1
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Commit formatting changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: apply prettier'

  check:
    needs: [format, commit-format]
    # Run when format was skipped (push/fork) or made no change.
    # Skip when format pushed a commit: that push starts a new run.
    if: ${{ !cancelled() && needs.commit-format.outputs.changed != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm typecheck

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: pnpm lint

      - name: Format check
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: pnpm format:check

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test
