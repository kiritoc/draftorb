name: CI

# Setup for auto-format (optional): GitHub App with Contents: read & write on
# this repo, repo variable FORMAT_BOT_APP_ID, secret FORMAT_BOT_PRIVATE_KEY.
# Without the variable the `format` job is skipped.
# After the bot pushes, run `git pull --rebase` before pushing again.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs: cancel superseded runs. main: let every commit finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs first. If it pushes a fix, the push starts a new run of this workflow
  # which cancels this one (concurrency), so lint/test never run on stale code.
  format:
    # Same-repo PRs only; forks and Dependabot have no access to the app secret.
    if: >-
      vars.FORMAT_BOT_APP_ID != '' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      # An App token (unlike GITHUB_TOKEN) makes the push trigger CI again.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FORMAT_BOT_APP_ID }}
          private-key: ${{ secrets.FORMAT_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format and push
        env:
          BOT_EMAIL: format-bot@users.noreply.github.com
        run: |
          # Never loop: stop if the bot's own commit is already the tip.
          if [ "$(git log -1 --format=%ce)" = "$BOT_EMAIL" ]; then
            echo "Tip is the bot's commit; nothing to do"
            exit 0
          fi

          # .github is excluded: the App has no `workflows` permission,
          # so a push touching workflow files would be rejected.
          pnpm prettier --write . '!.github/**'

          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi

          git -c user.name=format-bot -c user.email="$BOT_EMAIL" \
            commit -a -m 'style: apply prettier'
          git push || echo "::warning::Push rejected (branch moved); the next run will format"

  lint:
    needs: format
    # `format` is skipped on push/forks: still run (only a cancel stops us).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Run all three so every problem shows up in one go.
      - run: pnpm format:check
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}

  test:
    needs: format
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
