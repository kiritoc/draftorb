name: Release

# BL-025 (D-130): builds the Windows desktop app into an NSIS installer and
# publishes it. Pushing a `v*` tag creates a GitHub release with the installer
# attached; `workflow_dispatch` builds the same artifact and uploads it as a
# workflow artifact only (no release).
#
# The artifact is UNSIGNED by owner decision (D-130): Windows SmartScreen shows
# a warning at install; users proceed via "More info" -> "Run anyway" (SETUP.md
# > Installing the Windows app). No code signing, no auto-update, Windows only.
#
# `pnpm check` already runs on windows-latest in ci.yml; this workflow only
# needs the Tauri bundle build. The Rust toolchain exception applies to
# apps/desktop build tooling only (D-115).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # release creation/upload on tag pushes; read would suffice for dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pin a stable toolchain (windows-latest also ships one, but a release
      # build should not depend on the image's default).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `tauri build` runs the UI build (beforeBuildCommand) and bundles the
      # NSIS installer under src-tauri/target/release/bundle/nsis/.
      - name: Build Windows installer
        run: pnpm --filter @draftorb/desktop tauri build

      # Public-repo safety: the installer embeds the frontend bundle; make sure
      # no Riot key pattern reached it (same needle as check-secrets.mjs).
      - name: Scan installer for leaked secrets
        shell: pwsh
        run: |
          $hits = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle" -Recurse -File |
            Select-String -Pattern 'RGAPI-' -SimpleMatch -List
          if ($hits) {
            Write-Error "Riot key pattern found in bundle output: $($hits.Path -join ', ')"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: draftorb-windows-x64-setup-${{ github.ref_name }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

      # Tag pushes only: attach the installer to a GitHub release. Manual
      # dispatch runs stop at the workflow artifact above.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $installer) { Write-Error "No NSIS installer found"; exit 1 }
          gh release create "$env:TAG" $installer.FullName `
            --repo "${{ github.repository }}" `
            --title "DraftOrb $env:TAG" `
            --notes "Unsigned Windows installer (SmartScreen warning expected — see docs/SETUP.md). Download the *.exe asset and run it."
